# 发布 GitHub Release 时，通过 Slack Workflow Builder 的 webhook 通知 #meetap-community。
# webhook 接收 4 个文本变量：version / title / url / notes（与 Slack 工作流里的变量名一致）。
name: Release Slack Notify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "补发通知的版本 tag（如 v1.7.1）"
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          release=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json tagName,name,url,body)

          # 标题去掉开头重复的版本号（Release 名形如 "v1.7.1 — xxx"）
          title=$(jq -r '.name' <<<"$release" | sed -E "s/^${TAG}[[:space:]]*[—–:-]*[[:space:]]*//")
          [[ -z "$title" ]] && title="$TAG"

          # Slack 工作流变量不渲染 GitHub Markdown：标题改成【】、去掉粗体和代码围栏，限长 1500 字
          notes=$(jq -r '.body' <<<"$release" \
            | sed -E -e 's/^#{1,6}[[:space:]]+(.*)$/【\1】/' -e 's/\*\*([^*]+)\*\*/\1/g' -e '/^```/d' \
            | cat -s)
          if (( ${#notes} > 1500 )); then
            notes="${notes:0:1500}…（完整说明见链接）"
          fi

          payload=$(jq -n \
            --arg version "$TAG" \
            --arg title "$title" \
            --arg url "$(jq -r '.url' <<<"$release")" \
            --arg notes "$notes" \
            '{version: $version, title: $title, url: $url, notes: $notes}')

          curl -fsS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
