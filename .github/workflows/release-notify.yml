# 发布 GitHub Release 时，通过 Slack Workflow Builder 的 webhook 通知 #meetap-community。
# webhook 接收 4 个文本变量：version / title / url / notes（与 Slack 工作流里的变量名一致）。
name: Release Slack Notify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "补发通知的版本 tag（如 v1.7.1）"
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          release=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json tagName,name,url,body)

          # 标题去掉开头重复的版本号（Release 名形如 "v1.7.1 — xxx"）
          title=$(jq -r '.name' <<<"$release" | sed -E "s/^${TAG}[[:space:]]*[—–:-]*[[:space:]]*//")
          [[ -z "$title" ]] && title="$TAG"

          # 通知只发要点：优先取说明里 <!-- slack --> … <!-- /slack --> 包住的摘要（GitHub 页面不显示）；
          # 没有摘要就列出带「：」的描述性小节标题（跳过「修复」「其他」这类空标题）。完整说明看链接
          body=$(jq -r '.body' <<<"$release" | tr -d '\r')
          notes=$(sed -n '/<!-- slack -->/,/<!-- \/slack -->/p' <<<"$body" | sed '1d;$d')
          if [[ -z "$notes" ]]; then
            notes=$(sed -nE 's/^#{1,6}[[:space:]]+(.*[：:].*)$/• \1/p' <<<"$body" | sed -E 's/`//g')
          fi
          [[ -z "$notes" ]] && notes="详见发布说明"
          # Slack 工作流变量按纯文本显示（* ` _ 不渲染），去掉反引号；重点用 emoji 和【】标注
          notes=$(sed -E 's/`//g' <<<"$notes")

          payload=$(jq -n \
            --arg version "$TAG" \
            --arg title "$title" \
            --arg url "$(jq -r '.url' <<<"$release")" \
            --arg notes "$notes" \
            '{version: $version, title: $title, url: $url, notes: $notes}')

          curl -fsS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
